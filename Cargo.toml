[package]
name = "herdr-stt"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "Local speech-to-text daemon and Herdr voice input plugin"
license = "MIT"

[lib]
name = "herdr_stt"
path = "src/lib.rs"

[[bin]]
name = "herdr-stt"
path = "src/bin/herdr-stt.rs"

[[bin]]
name = "herdr-sttd"
path = "src/bin/herdr-sttd.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.20"
