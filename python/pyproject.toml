[project]
name = "herdr-stt-worker"
version = "0.3.0"
description = "Long-lived faster-whisper worker for herdr-sttd"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper==1.2.1",
]

[project.optional-dependencies]
cuda = [
  "nvidia-cublas-cu12>=12,<13; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_stt_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
